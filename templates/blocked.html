<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Attack Detected</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #0f1a2d;
      --border: rgba(148, 163, 184, 0.18);
      --text: #e5e7eb;
      --muted: rgba(226, 232, 240, 0.75);
      --danger: #ef4444;
      --accent: #22c55e;
    }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      background: radial-gradient(1200px 600px at 20% 10%, rgba(239, 68, 68, 0.25), transparent 55%),
                  radial-gradient(900px 500px at 90% 20%, rgba(34, 197, 94, 0.20), transparent 50%),
                  linear-gradient(180deg, #050815, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 760px;
      background: rgba(15, 26, 45, 0.85);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.55);
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
    .top {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 22px 22px 16px 22px;
      border-bottom: 1px solid var(--border);
    }
    .badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.14);
      border: 1px solid rgba(239, 68, 68, 0.35);
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }
    .badge svg { width: 22px; height: 22px; fill: var(--danger); }
    .title h1 {
      font-size: 20px;
      margin: 0;
      letter-spacing: 0.2px;
    }
    .title p {
      margin: 4px 0 0 0;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.4;
    }
    .content {
      padding: 18px 22px 22px 22px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 10px;
    }
    .kv {
      background: rgba(11, 18, 32, 0.55);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 14px;
    }
    .kv .k {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .kv .v {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.2px;
      word-break: break-word;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 8px 12px;
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: rgba(239, 68, 68, 0.14);
      color: #fecaca;
      font-weight: 600;
      font-size: 13px;
    }
    .footer {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12.5px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      color: rgba(226,232,240,0.85);
      font-weight: 600;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12 2 2 6v6c0 5.55 3.84 10.74 10 12 6.16-1.26 10-6.45 10-12V6l-10-4Zm0 6.75a1 1 0 0 1 1 1V13a1 1 0 1 1-2 0V9.75a1 1 0 0 1 1-1Zm0 10a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5Z"/>
        </svg>
      </div>
      <div class="title">
        <h1>Attack Detected</h1>
        <p>Your request was blocked to protect the demo application.</p>
      </div>
    </div>
    <div class="content">
      <div class="pill">Request Blocked</div>
      <div class="grid">
        <div class="kv">
          <div class="k">Attack Type</div>
          <div class="v">{{ attack_type }}</div>
        </div>
        <div class="kv">
          <div class="k">WAF Action</div>
          <div class="v">{{ action }}</div>
        </div>
      </div>
      <div class="footer">
        <div><span class="brand">Protected by WAF Proxy Framework</span></div>
        <div>Request ID: {{ request_id }}</div>
      </div>
    </div>
  </div>
</body>
</html>
