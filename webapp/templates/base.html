<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title or "Vulnerable Demo App" }}</title>
  <style>
    :root{
      --bg:#0b1220;
      --panel:#0f1a2d;
      --panel2:#0b172a;
      --border:rgba(148,163,184,.18);
      --text:#e5e7eb;
      --muted:rgba(226,232,240,.72);
      --accent:#22c55e;
      --danger:#ef4444;
      --warn:#f59e0b;
      --info:#60a5fa;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 600px at 10% 10%, rgba(96,165,250,.18), transparent 55%),
                  radial-gradient(900px 500px at 90% 15%, rgba(34,197,94,.16), transparent 55%),
                  linear-gradient(180deg, #050815, var(--bg));
      color:var(--text);
      min-height:100vh;
    }
    a{color:inherit;text-decoration:none}
    .layout{display:flex; min-height:100vh}
    .sidebar{
      width:260px;
      border-right:1px solid var(--border);
      background: rgba(15,26,45,.78);
      backdrop-filter: blur(10px);
      padding:18px 16px;
      position:sticky;
      top:0;
      height:100vh;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      padding:10px 10px 14px 10px;
      border-bottom:1px solid var(--border);
      margin-bottom:14px;
    }
    .logo{
      width:36px; height:36px; border-radius:12px;
      background: rgba(96,165,250,.18);
      border:1px solid rgba(96,165,250,.35);
      display:grid; place-items:center; font-weight:800;
      letter-spacing:.5px;
    }
    .brand .name{font-weight:800}
    .nav{display:flex; flex-direction:column; gap:8px; padding:6px}
    .nav a{
      padding:10px 10px;
      border:1px solid transparent;
      border-radius:12px;
      color: rgba(226,232,240,.85);
      background: rgba(11,18,32,.35);
    }
    .nav a:hover{border-color:var(--border); background: rgba(11,18,32,.6)}
    .main{flex:1; padding:22px 22px 34px}
    .topbar{
      display:flex; justify-content:space-between; align-items:center;
      gap:12px;
      border:1px solid var(--border);
      border-radius:16px;
      padding:14px 16px;
      background: rgba(15,26,45,.55);
      backdrop-filter: blur(10px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      border-radius:999px;
      padding:8px 12px;
      border:1px solid var(--border);
      background: rgba(11,18,32,.6);
      color: rgba(226,232,240,.85);
      font-weight:700;
      font-size:12.5px;
    }
    .grid{display:grid; grid-template-columns: 1.1fr .9fr; gap:16px; margin-top:16px}
    .card{
      border:1px solid var(--border);
      border-radius:16px;
      background: rgba(15,26,45,.55);
      padding:16px;
      backdrop-filter: blur(10px);
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
    }
    .card h3{margin:0 0 10px 0; font-size:14px; color: rgba(226,232,240,.9); letter-spacing:.25px}
    .muted{color:var(--muted); font-size:13px; line-height:1.45}
    .row{display:flex; gap:12px; flex-wrap:wrap}
    .kpi{
      flex:1;
      min-width:160px;
      padding:12px;
      border-radius:14px;
      border:1px solid var(--border);
      background: rgba(11,18,32,.55);
    }
    .kpi .n{font-size:20px; font-weight:900}
    .kpi .l{font-size:12px; color:var(--muted); margin-top:2px}
    input, textarea{
      width:100%;
      padding:12px 12px;
      border-radius:14px;
      border:1px solid var(--border);
      background: rgba(11,18,32,.6);
      color: var(--text);
      outline:none;
    }
    textarea{min-height:96px; resize:vertical}
    button{
      padding:11px 14px;
      border-radius:14px;
      border:1px solid rgba(34,197,94,.35);
      background: rgba(34,197,94,.14);
      color: #bbf7d0;
      font-weight:800;
      cursor:pointer;
    }
    button:hover{background: rgba(34,197,94,.22)}
    .danger{
      border-color: rgba(239,68,68,.35);
      background: rgba(239,68,68,.14);
      color:#fecaca;
    }
    .small{font-size:12px}
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
    @media (max-width: 980px){
      .sidebar{display:none}
      .grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
